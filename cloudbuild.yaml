substitutions:
  _SERVICE_NAME: bofferelo-web
  _REGION: us-central1

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - SUPABASE_URL
      - SUPABASE_PUBLISHABLE_KEY
      - API_URL
    args:
      - -c
      - |
        docker build \
          --build-arg EXPO_PUBLIC_SUPABASE_URL=$$SUPABASE_URL \
          --build-arg EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$$SUPABASE_PUBLISHABLE_KEY \
          --build-arg EXPO_PUBLIC_API_URL=$$API_URL \
          --tag gcr.io/$PROJECT_ID/${_SERVICE_NAME} \
          .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/bofferelo-supabase-url/versions/latest
      env: SUPABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/bofferelo-supabase-key/versions/latest
      env: SUPABASE_PUBLISHABLE_KEY
    - versionName: projects/$PROJECT_ID/secrets/bofferelo-api-url/versions/latest
      env: API_URL

images:
  - gcr.io/$PROJECT_ID/${_SERVICE_NAME}
